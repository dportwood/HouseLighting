# Copy to config.toml and adjust. Times are local (24h).

show_dir = '\\THEHUB\Media\xlights'   # xLights show folder (UNC path: mapped drives may not be up at logon)
fps = 20
skip_controllers = ["FPP-Housenew"]   # the house Pi (.64) is broken

http_port = 8080
override_minutes = 30            # tablet changes revert to the show after this long
allow_live_outside_window = false
# Projector Pis (see projector/README.md). media_dir is the video library on this PC.
# media_dir = 'C:\Users\david\Videos\AtmosFX'
# [[projectors]] entries go at the end of the file (see below).

# kiosk_pin = "2468"            # leaves kiosk mode (falls back to api_token); needed for kiosk mode
# kiosk_seconds = 60             # how long a visitor's pattern plays
# api_token = "change-me"        # when set, Off/Skip need it (?token=... or X-Api-Token)

shuffle = true

[[windows]]
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
start = "16:50"
end = "23:15"

# Playlist: rendered xLights sequences and/or live effects (chase, fade, twinkle, strobe, solid).
[[playlist]]
type = "fseq"
file = "Halloween Chase.fseq"

[[playlist]]
type = "effect"
effect = "strobe"
seconds = 30
colors = ["#FFFFFF", "#FF3000", "#400080"]
speed = 40               # strobe: speed/10 = percent of pixels in each flash

[[playlist]]
name = "Witch Twinkle"
type = "effect"
effect = "twinkle"
seconds = 120
colors = ["#400080", "#00C000"]   # Witch theme
speed = 100
brightness = 100         # percent; playlist items each have their own

# What the tablet starts from.
[live]
effect = "chase"
colors = ["#400080", "#FF3000"]
speed = 40
band = 8

# Theme buttons on the tablet.
[presets]
Halloween = ["#400080", "#FF3000"]
"Pumpkin" = ["#FF3000", "#FF7A00", "#801500"]
"Witch" = ["#400080", "#00C000"]
Christmas = ["#FF0000", "#00A000"]
"Candy Cane" = ["#FF0000", "#FFFFFF"]
"Warm White" = ["#FFB060"]
"Red White Blue" = ["#FF0000", "#FFFFFF", "#0030FF"]
# Rainbow: 16 hues evenly spaced by how different they look, as LED values
# (the pixels run gamma 1.0). Regenerate with houselights.colors.led_rainbow(16).
Rainbow = ["#FF0000", "#FF3400", "#FF6900", "#FFB400", "#B7FF00", "#07FF00", "#00FF7A", "#00FFDC",
           "#00C8FF", "#0085FF", "#003EFF", "#1200FF", "#4800FF", "#C100FF", "#FF0083", "#FF002B"]

# Projectors (uncomment with media_dir above):
