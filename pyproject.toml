[project]
name = "houselights"
version = "0.1.0"
description = "Real-time player for the house light show (xLights layout, DDP output to FPP controllers)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "zstandard>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["houselights"]
